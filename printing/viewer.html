<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>从模型到路径 · beads_philosophy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c23;color:#e6eee7;font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}header{display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:28px;letter-spacing:.03em;margin:8px 0}p{color:#a7bbb9;line-height:1.6}.eyebrow{letter-spacing:.2em;color:#65cbb9;font-size:12px}.views{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin:22px 0}.pane{background:#152730;border:1px solid #294148;border-radius:18px;overflow:hidden;position:relative}canvas{width:100%;height:450px;display:block;touch-action:none}.caption{position:absolute;top:16px;left:18px;color:#adc2bf;pointer-events:none}footer{display:flex;gap:18px;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:160px;accent-color:#61d6bd}button{background:#62d8bb;color:#102723;border:0;border-radius:20px;padding:10px 24px;font-weight:700;cursor:pointer}label{color:#b6cac4}#stats{color:#eac38b;white-space:pre-line;font-variant-numeric:tabular-nums}details{margin-top:24px;color:#a7bbb9;line-height:1.7}summary{cursor:pointer}@media(max-width:800px){.views{grid-template-columns:1fr}canvas{height:340px}header{display:block}main{padding:18px}}
</style><main>
<header><div><div class="eyebrow">BEADS PHILOSOPHY / GEOMETRY LAB</div><h1>一层截面，一段路径</h1><p>拖动画面旋转；沿时间条观察喷头如何走过真实截面。</p></div><div id="stats"></div></header>
<div class="views"><div class="pane"><span class="caption">路径累积 · 金色为喷头</span><canvas id="world"></canvas></div><div class="pane"><span class="caption">当前截面 · 顶视</span><canvas id="slice"></canvas></div></div>
<footer><button id="play">播放</button><input id="progress" aria-label="打印层和层内路径进度" type="range" min="0" max="1" step="0.001" value="0.45"><label><input id="showSupports" type="checkbox" checked> 支撑候选</label><label><input id="showMesh" type="checkbox"> 模型线框</label></footer>
<details><summary>关于这次几何演示</summary><p>截面由实际三角网格与水平面的交线形成。喷头按路径弧长移动；播放速度不代表真实打印时长。红色为从平台生长的支撑候选，已作离散射线碰撞筛查，未完成生产切片、强度或热学验证。需要实际打印时，请用专业切片器和对应设备、材料配置检查。</p><p>本页未输出 G-code，也未连接打印机。模型线框为显示抽样；全部切片路径保存在 simulation.json。</p></details>
</main><script>
const D=/*DATA*/ null;
if(!D){document.querySelector('h1').textContent='请先运行 slice_and_support.py 生成预览';}
else {
const world=document.querySelector('#world'),slice=document.querySelector('#slice'),slider=document.querySelector('#progress'),play=document.querySelector('#play');
let yaw=-.65,pitch=.55,drag=null,playing=false,last=0;
const bounds=D.bounds_mm,ext=bounds[1].map((q,i)=>q-bounds[0][i]),span=Math.max(...ext)*1.5,center=[0,0,ext[2]/2];
const layers=D.layers.map(l=>{let total=0,last=null;let segments=[];for(const p of l.paths){const first=[...p.points[0],l.print_z_mm];if(last){const length=Math.hypot(first[0]-last[0],first[1]-last[1]);if(length>1e-9){segments.push({a:last,b:first,start:total,length,type:'travel'});total+=length;}}for(let i=1;i<p.points.length;i++){const a=p.points[i-1],b=p.points[i],length=Math.hypot(b[0]-a[0],b[1]-a[1]);if(length>1e-9){segments.push({a:[...a,l.print_z_mm],b:[...b,l.print_z_mm],start:total,length,type:p.type});total+=length;}}last=[...p.points.at(-1),l.print_z_mm];}return {...l,segments,total};});
function setup(c){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);}const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);return {ctx,w:r.width,h:r.height};}
function project(p,w,h){const x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],xx=x*Math.cos(yaw)-y*Math.sin(yaw),yy=x*Math.sin(yaw)+y*Math.cos(yaw),f=Math.min(w,h)/span;return [w/2+xx*f,h/2+(yy*Math.sin(pitch)-z*Math.cos(pitch))*f];}
function stroke(ctx,a,b,color,width=1){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();}
function draw(){const W=setup(world),S=setup(slice),p=Number(slider.value)*layers.length,li=Math.min(layers.length-1,Math.floor(p)),f=p>=layers.length?1:p-li,current=layers[li],limit=current.total*f;
const proj=v=>project(v,W.w,W.h);const bed=Math.max(ext[0],ext[1])/2+6;
for(let q=-bed;q<=bed;q+=bed/6){stroke(W.ctx,proj([q,-bed,0]),proj([q,bed,0]),'#28414a');stroke(W.ctx,proj([-bed,q,0]),proj([bed,q,0]),'#28414a');}
if(document.querySelector('#showMesh').checked)for(const e of D.context_edges)stroke(W.ctx,proj(e[0]),proj(e[1]),'#52736b30',.6);
if(document.querySelector('#showSupports').checked)for(const c of D.supports){const top=Math.min(c.top_z_mm,current.print_z_mm);stroke(W.ctx,proj([...c.xy_mm,0]),proj([...c.xy_mm,top]),'#ec8e8888',Math.max(1.5,2*c.radius_mm*Math.min(W.w,W.h)/span));}
let nozzle=null;
for(let i=0;i<=li;i++)for(const s of layers[i].segments){if(i===li&&s.start>limit)break;const u=i<li?1:Math.min(1,Math.max(0,(limit-s.start)/s.length)),end=s.a.map((v,j)=>v+(s.b[j]-v)*u);if(s.type!=='travel')stroke(W.ctx,proj(s.a),proj(end),i===li?'#86ebce':'#50ad9990',i===li?1.65:1.2);if(i===li)nozzle=end;}
const sx=Math.max(ext[0],ext[1])*1.25,sc=Math.min(S.w,S.h)/sx,top=v=>[S.w/2+v[0]*sc,S.h/2-v[1]*sc];
for(const c of current.contours)for(const ring of [c.outer,...c.holes])for(let i=1;i<ring.length;i++)stroke(S.ctx,top(ring[i-1]),top(ring[i]),'#a1b9b755',1);
for(const s of current.segments){if(s.type==='travel')continue;stroke(S.ctx,top(s.a),top(s.b),'#385851',1);if(s.start<limit){const u=Math.min(1,(limit-s.start)/s.length),end=s.a.map((v,j)=>v+(s.b[j]-v)*u);stroke(S.ctx,top(s.a),top(end),s.type==='perimeter'?'#8ce9c9':'#54bdae',2);}}
if(nozzle){const point=proj(nozzle);stroke(W.ctx,point,[point[0],point[1]-24],'#efc384',3);for(const [v,c] of [[point,W.ctx],[top(nozzle),S.ctx]]){c.beginPath();c.arc(v[0],v[1],4,0,Math.PI*2);c.fillStyle='#ffe0a7';c.fill();}}
document.querySelector('#stats').textContent=`第 ${li+1} / ${layers.length} 层\n截面高度 ${current.slice_z_mm.toFixed(2)} mm · ${D.supports.length} 根支撑候选`;
}
world.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];world.setPointerCapture(e.pointerId);});world.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-drag[0])*.007;pitch=Math.max(.1,Math.min(1.45,pitch+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];draw();}});world.addEventListener('pointerup',()=>drag=null);world.addEventListener('pointercancel',()=>drag=null);
slider.addEventListener('input',draw);document.querySelectorAll('input[type=checkbox]').forEach(c=>c.addEventListener('change',draw));window.addEventListener('resize',draw);
play.onclick=()=>{playing=!playing;if(playing&&Number(slider.value)>=1)slider.value=0;play.textContent=playing?'暂停':'播放';};
function animate(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(playing){slider.value=Math.min(1,Number(slider.value)+dt/32);if(Number(slider.value)>=1){playing=false;play.textContent='播放';}draw();}requestAnimationFrame(animate);}draw();requestAnimationFrame(animate);
}
</script></html>
